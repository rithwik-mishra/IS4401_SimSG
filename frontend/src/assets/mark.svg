<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient: Deep Forest Pine -->
    <linearGradient id="simsgBg" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#184236" />
      <stop offset="50%" stop-color="#12332a" />
      <stop offset="100%" stop-color="#0a1f18" />
    </linearGradient>

    <!-- Ring & Accent Gradient: Luminous Sage through Emerald to Deep Jade -->
    <linearGradient id="emeraldGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dcfce7" />
      <stop offset="35%" stop-color="#86efac" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Central Insight Core Gradient -->
    <linearGradient id="coreGrad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d1fae5" />
      <stop offset="80%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Speech Bubble Silhouette & Border -->
  <path
    d="M 16.9 73.9 L 7.5 92.5 L 31.6 85.7 A 42 42 0 1 1 16.9 73.9 Z"
    fill="url(#simsgBg)"
    stroke="url(#emeraldGrad)"
    stroke-width="5.5"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Top Multi-Agent Constellation Network -->
  <g stroke="url(#emeraldGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
    <line x1="50" y1="15" x2="36" y2="23" />
    <line x1="50" y1="15" x2="64" y2="23" />
    <line x1="36" y1="23" x2="23" y2="27" />
    <line x1="64" y1="23" x2="77" y2="27" />
    <line x1="36" y1="23" x2="50" y2="30" />
    <line x1="64" y1="23" x2="50" y2="30" />
    <line x1="50" y1="15" x2="50" y2="30" />
    <!-- Connector linking network to central intelligence core -->
    <line x1="50" y1="30" x2="50" y2="37" stroke-dasharray="1.5 2.5" />
  </g>

  <!-- Constellation Persona Nodes -->
  <g fill="url(#emeraldGrad)">
    <circle cx="50" cy="15" r="4.2" />
    <circle cx="36" cy="23" r="3.8" />
    <circle cx="64" cy="23" r="3.8" />
    <circle cx="23" cy="27" r="3.2" />
    <circle cx="77" cy="27" r="3.2" />
    <circle cx="50" cy="30" r="3.6" />
  </g>

  <!-- Center Symbolic Insight Core (NO letters, NO words) -->
  <!-- Radiant 4-Point AI Intelligence Star & Focus Group Core -->
  <g filter="url(#softGlow)">
    <!-- Central Radiant Facets -->
    <path
      d="M 50 36 C 50.8 45.2 54.8 49.2 64 50 C 54.8 50.8 50.8 54.8 50 64 C 49.2 54.8 45.2 50.8 36 50 C 45.2 49.2 49.2 45.2 50 36 Z"
      fill="url(#coreGrad)"
    />
    <!-- Luminous Central Focus Hub -->
    <circle cx="50" cy="50" r="4.8" fill="#ffffff" />
    <circle cx="50" cy="50" r="2.4" fill="#059669" />

    <!-- Flanking Demographic Cohort Orbit Nodes -->
    <circle cx="28" cy="50" r="2.8" fill="url(#emeraldGrad)" />
    <circle cx="72" cy="50" r="2.8" fill="url(#emeraldGrad)" />
    <line x1="30.8" y1="50" x2="36" y2="50" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="64" y1="50" x2="69.2" y2="50" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Bottom Uplift Kinetic Swoosh Arrows -->
  <g fill="url(#emeraldGrad)" stroke="url(#emeraldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper Swoosh Arrow -->
    <path
      d="M 27 73.5 C 35 78.5 45 78.5 53 73"
      fill="none"
      stroke-width="3.6"
    />
    <polygon points="52,70 58.5,72 54,77" />

    <!-- Lower Swoosh Arrow -->
    <path
      d="M 21.5 81 C 35 89 51 89 65 80.5"
      fill="none"
      stroke-width="4.2"
    />
    <polygon points="63.5,77 71.5,79 66.5,85.5" />
  </g>
</svg>
