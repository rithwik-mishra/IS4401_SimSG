<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Deep Dark Forest Green Background Radial Gradient -->
    <radialGradient id="simsgRadarBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a2e21" />
      <stop offset="55%" stop-color="#051811" />
      <stop offset="100%" stop-color="#020c08" />
    </radialGradient>

    <!-- Translucent Radar Sweep Sector Gradient -->
    <linearGradient id="radarSweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="65%" stop-color="#34d399" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Emerald Glow Filter for Nodes & Central Core -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Container with Deep Forest Green Base -->
  <rect width="100" height="100" rx="22" fill="url(#simsgRadarBg)" />

  <!-- Radar Scanning Sweep Sector (Upper-Right Quadrant: ~12:30 to ~2:00) -->
  <path
    d="M 50 50 L 50 19 A 31 31 0 0 1 76.5 32.5 Z"
    fill="url(#radarSweepGrad)"
  />
  <!-- Leading Edge Radar Sweep Beam -->
  <line
    x1="50"
    y1="50"
    x2="76.5"
    y2="32.5"
    stroke="#a7f3d0"
    stroke-width="1.8"
    stroke-linecap="round"
    filter="url(#emeraldGlow)"
  />

  <!-- Concentric Demographic Scanning Rings -->
  <!-- Ring 1 (Inner demographic tier) -->
  <circle cx="50" cy="50" r="9" stroke="#10b981" stroke-width="1.6" opacity="0.9" />
  <!-- Ring 2 (Middle-inner tier) -->
  <circle cx="50" cy="50" r="14.5" stroke="#10b981" stroke-width="1.6" opacity="0.9" />
  <!-- Ring 3 (Median demographic tier) -->
  <circle cx="50" cy="50" r="20" stroke="#10b981" stroke-width="1.6" opacity="0.9" />
  <!-- Ring 4 (Middle-outer tier, highlighted) -->
  <circle cx="50" cy="50" r="25.5" stroke="#34d399" stroke-width="1.8" opacity="0.95" />
  <!-- Ring 5 (Outer radar boundary) -->
  <circle cx="50" cy="50" r="31" stroke="#10b981" stroke-width="1.8" opacity="0.95" />

  <!-- Central Decision Core (Luminous Bullseye) -->
  <circle
    cx="50"
    cy="50"
    r="4.6"
    stroke="#34d399"
    stroke-width="1.8"
    fill="#051811"
    filter="url(#emeraldGlow)"
  />
  <circle cx="50" cy="50" r="1.8" fill="#a7f3d0" />

  <!-- Internal Crosshair Grid Lines -->
  <g stroke="#10b981" stroke-width="1.4" opacity="0.85">
    <!-- Vertical Crosshair Axis -->
    <line x1="50" y1="19" x2="50" y2="81" />
    <!-- Horizontal Crosshair Axis -->
    <line x1="19" y1="50" x2="81" y2="50" />
    <!-- Subtle Diagonal Crosshair Axes -->
    <line x1="28.1" y1="28.1" x2="71.9" y2="71.9" stroke-dasharray="2 2.5" opacity="0.55" />
    <line x1="28.1" y1="71.9" x2="71.9" y2="28.1" stroke-dasharray="2 2.5" opacity="0.55" />
  </g>

  <!-- Branching Circuit Traces & Synthetic Agent Antennae -->
  <g stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- North / Top Main Antenna -->
    <line x1="50" y1="19" x2="50" y2="9.5" stroke-width="1.6" />
    <line x1="50" y1="15" x2="56" y2="13" />
    <line x1="50" y1="21" x2="63" y2="15" />

    <!-- Top-Left Micro-Bus Pins (Neural Processor Bus) -->
    <line x1="43" y1="22" x2="43" y2="13.5" />
    <line x1="39" y1="24.5" x2="39" y2="15.5" />
    <line x1="35" y1="27" x2="35" y2="17.5" />
    <line x1="37.5" y1="22.5" x2="28" y2="19" />

    <!-- Top-Right Branches -->
    <line x1="71.9" y1="28.1" x2="71" y2="20" />
    <line x1="67" y1="30" x2="63" y2="24" />

    <!-- East / Right Main Bus -->
    <line x1="81" y1="50" x2="90" y2="50" stroke-width="1.6" />
    <!-- Right Stepped PCB Circuit -->
    <path d="M 76 40 L 81.5 40 L 81.5 33 L 86 33" fill="none" />
    <line x1="81.5" y1="33" x2="81.5" y2="27" />
    <!-- Lower Right Stems -->
    <line x1="76" y1="60" x2="85" y2="68" />
    <line x1="79" y1="55" x2="86" y2="58" />

    <!-- South / Bottom Main Antenna -->
    <line x1="50" y1="81" x2="50" y2="91" stroke-width="1.6" />
    <line x1="50" y1="80" x2="44" y2="86" />
    <line x1="40" y1="77" x2="35" y2="83" />
    <!-- Bottom Right Stepped Trace -->
    <path d="M 57 77 L 57 85 L 53 85" fill="none" />
    <line x1="61" y1="76" x2="64" y2="82" />

    <!-- South-West / Bottom-Left Stems -->
    <line x1="28.1" y1="71.9" x2="32" y2="78" />
    <line x1="29" y1="68" x2="25" y2="71" />

    <!-- West / Left Main Bus -->
    <line x1="19" y1="50" x2="10" y2="50" stroke-width="1.6" />
    <line x1="22" y1="40" x2="15" y2="40" />
    <line x1="22" y1="60" x2="15" y2="60" />
    <line x1="28.1" y1="28.1" x2="18" y2="18" />
  </g>

  <!-- Synthetic Resident Speech Bubbles (Qualitative Feedback Nodes) -->
  <!-- 1. Top-Right Voice Bubble -->
  <g filter="url(#emeraldGlow)">
    <path
      d="M 61 21 C 59.5 21 58.5 22 58.5 23.5 C 58.5 24.8 59.3 25.7 60.5 25.9 L 59.8 28 L 62 26 C 64 26 65.5 25 65.5 23.5 C 65.5 22 64 21 61 21 Z"
      fill="#10b981"
    />
    <circle cx="60.8" cy="23.5" r="0.55" fill="#051811" />
    <circle cx="62" cy="23.5" r="0.55" fill="#051811" />
    <circle cx="63.2" cy="23.5" r="0.55" fill="#051811" />
  </g>

  <!-- 2. Bottom-Right Voice Bubble -->
  <g filter="url(#emeraldGlow)">
    <path
      d="M 60 72 C 58.5 72 57.5 73 57.5 74.5 C 57.5 75.8 58.3 76.7 59.5 76.9 L 58.8 79 L 61 77 C 63 77 64.5 76 64.5 74.5 C 64.5 73 63 72 60 72 Z"
      fill="#10b981"
    />
    <circle cx="59.8" cy="74.5" r="0.55" fill="#051811" />
    <circle cx="61" cy="74.5" r="0.55" fill="#051811" />
    <circle cx="62.2" cy="74.5" r="0.55" fill="#051811" />
  </g>

  <!-- 3. Bottom-Left Voice Bubble -->
  <g filter="url(#emeraldGlow)">
    <path
      d="M 26 64 C 24.5 64 23.5 65 23.5 66.5 C 23.5 67.8 24.3 68.7 25.5 68.9 L 24.8 71 L 27 69 C 29 69 30.5 68 30.5 66.5 C 30.5 65 29 64 26 64 Z"
      fill="#10b981"
    />
    <circle cx="25.8" cy="66.5" r="0.55" fill="#051811" />
    <circle cx="27" cy="66.5" r="0.55" fill="#051811" />
    <circle cx="28.2" cy="66.5" r="0.55" fill="#051811" />
  </g>

  <!-- Peripheral Demographic Agent Nodes (Solid & Hollow) -->
  <!-- Solid Glowing Nodes (Decision / Agent Points) -->
  <g fill="#34d399" filter="url(#emeraldGlow)">
    <circle cx="50" cy="9.5" r="2.2" />
    <circle cx="56" cy="13" r="1.6" />
    <circle cx="63" cy="15" r="1.6" />
    <circle cx="43" cy="13.5" r="1.5" />
    <circle cx="39" cy="15.5" r="1.5" />
    <circle cx="35" cy="17.5" r="1.5" />
    <circle cx="90" cy="50" r="2.2" />
    <circle cx="81.5" cy="27" r="1.6" />
    <circle cx="86" cy="33" r="1.6" />
    <circle cx="86" cy="58" r="1.6" />
    <circle cx="50" cy="91" r="2.2" />
    <circle cx="44" cy="86" r="1.6" />
    <circle cx="53" cy="85" r="1.6" />
    <circle cx="64" cy="82" r="1.6" />
    <circle cx="10" cy="50" r="2.2" />
    <circle cx="15" cy="40" r="1.6" />
    <circle cx="15" cy="60" r="1.6" />
    <circle cx="25" cy="71" r="1.6" />
  </g>

  <!-- Hollow Ring Nodes (Sensors / Ingestion Portals) -->
  <g stroke="#34d399" stroke-width="1.5" fill="none">
    <circle cx="28" cy="19" r="2" />
    <circle cx="18" cy="18" r="2.2" />
    <circle cx="71" cy="20" r="2" />
    <circle cx="85" cy="68" r="2" />
    <circle cx="35" cy="83" r="2" />
    <circle cx="32" cy="78" r="2" />
  </g>
</svg>